name: Build validation

on:
  push:
    branches: [main, improvements/data-integrity]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and build API
        run: |
          dotnet restore backend/BookDiscovery.Api/BookDiscovery.Api.csproj
          dotnet build backend/BookDiscovery.Api/BookDiscovery.Api.csproj --no-restore --configuration Release
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

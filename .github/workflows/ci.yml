name: CI

on:
  push:
    branches:
      - main
      - improvements/data-integrity
  pull_request:
    branches:
      - main
      - improvements/data-integrity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend build (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore backend/BookDiscovery.Api/BookDiscovery.Api.csproj

      - name: Build
        run: dotnet build backend/BookDiscovery.Api/BookDiscovery.Api.csproj --configuration Release --no-restore

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
